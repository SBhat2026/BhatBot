<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- This view renders LIVE agent state (task strings, tool names) that can contain text BhatBot read
     from the web or a file. It is loaded over file:// with contextIsolation, but it had no CSP at
     all: `connect-src 'none'` means a crafted task string can never be turned into an exfil beacon,
     and everything the scene needs (three.js, the GLBs, the draco wasm) is vendored locally. -->
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self' file:; script-src 'self' 'unsafe-inline' file: 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' file:; img-src 'self' file: data: blob:; connect-src 'self' file: data: blob:; object-src 'none'; base-uri 'none'; form-action 'none';" />
<title>BhatBot — Presence</title>
<style>
  :root { --accent:#5ad1ff; }
  html,body { margin:0; height:100%; background:radial-gradient(120% 90% at 50% 10%, #0c1420 0%, #070b12 62%, #04060a 100%); overflow:hidden;
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif; color:#cfe6f2; }
  #stage { position:fixed; inset:0; }
  #hud { position:fixed; left:0; right:0; top:0; padding:12px 18px; display:flex; align-items:center; gap:12px;
    pointer-events:none; text-transform:uppercase; letter-spacing:.2em; font-size:10.5px; color:#7fa8bd; }
  #hud b { color:var(--accent); font-weight:500; }
  #tally { margin-left:auto; letter-spacing:.12em; }
  #legend { position:fixed; left:16px; bottom:12px; font-size:10.5px; letter-spacing:.06em; color:#6f93a6; line-height:1.85; }
  #legend .lg-h { text-transform:uppercase; letter-spacing:.14em; font-size:9px; opacity:.7; margin-top:4px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; vertical-align:middle; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#4a6376; font-size:12px; letter-spacing:.2em; text-transform:uppercase; }
  /* Empty-room notice: shown when the roster is genuinely empty. This REPLACES the old fake demo
     roster, which was indistinguishable from real agents and disabled all interaction. */
  #empty { position:fixed; left:0; right:0; bottom:34%; text-align:center; pointer-events:none;
    color:#4e6b7d; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; opacity:0; transition:opacity .4s; }
  #empty.on { opacity:1; }

  /* Hover card — the "what is this one actually working on" read-out. */
  #hovercard { position:fixed; z-index:20; pointer-events:none; opacity:0; transform:translate(-50%,-100%) translateY(-10px);
    transition:opacity .12s; background:rgba(9,14,20,.95); border:1px solid #24323e; border-radius:9px;
    padding:9px 12px; min-width:190px; max-width:330px; box-shadow:0 10px 34px rgba(0,0,0,.55); }
  #hovercard.on { opacity:1; }
  #hc-top { display:flex; align-items:center; gap:8px; margin-bottom:2px; }
  #hc-name { font-size:12.5px; color:#dceff8; font-weight:600; letter-spacing:.02em; }
  #hc-status { margin-left:auto; font-size:9.5px; text-transform:uppercase; letter-spacing:.12em; color:#7fa8bd; }
  #hc-task { font-size:11px; color:#9fbccd; line-height:1.45; margin-top:4px; }
  #hc-step { font-size:10.5px; color:#7c9db0; line-height:1.4; margin-top:4px; font-style:italic;
    border-left:2px solid #2a3a47; padding-left:7px; }
  #hc-foot { margin-top:6px; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:#5c7b8d; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="loading">Loading the room…</div>
  <div id="empty">No agents deployed — the office is idle</div>
  <div id="hovercard">
    <div id="hc-top"><span class="dot" id="hc-dot"></span><span id="hc-name"></span><span id="hc-status"></span></div>
    <div id="hc-task"></div>
    <div id="hc-step"></div>
    <div id="hc-foot"></div>
  </div>
  <div id="hud"><span>BhatBot · <b>Fleet Presence</b></span><span id="tally">—</span></div>
  <!-- TWO CHANNELS, TWO LEGENDS. Colour says WHAT an agent is doing and is built from whoever is
       actually on the floor — a nine-row legend for three working agents is a legend nobody reads.
       Motion says HOW IT IS GOING, and motion cannot be shown as a swatch, so it is described. -->
  <div id="legend">
    <div id="legend-desig"></div>
    <div id="legend-state" style="margin-top:6px;color:#5a7688;">pulsing = working · dim = idle · red = failed</div>
    <div style="margin-top:4px;color:#5a7688;">hover to read · click to steer · drag to look</div>
  </div>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { clone as skeletonClone } from 'three/addons/utils/SkeletonUtils.js';

const STATE_COLOR = { idle:0x3a4a5a, thinking:0xf2c14e, working:0x5ad1ff, done:0x59e39b, error:0xff6b6b };
const STATE_CSS   = { idle:'#3a4a5a', thinking:'#f2c14e', working:'#5ad1ff', done:'#59e39b', error:'#ff6b6b' };

// ── HUE MEANS WHAT, MOTION MEANS HOW IT IS GOING ──────────────────────────────────────────────────
// This office used to colour agents by STATE, which makes every agent in a busy fleet the same colour
// and answers a question the activity log already answers. What you want to read across the room is
// the DIVISION OF LABOUR — two on research, one writing code, one driving a browser.
//
// The palette ARRIVES WITH THE ROSTER (presenceSnapshot ships lib/designation.forRenderer()). It is
// not defined here, and it must not be: this file is an iframe on file:// that cannot require() the
// module, and a second copy of the palette growing here is exactly how an office ends up with a legend
// that is a lie. scripts/test-designation.js fails if any designation colour appears in this file.
//
// Until a snapshot arrives every agent is grey, which is the honest answer: an unknown designation
// must never borrow a real one's colour, because that asserts a division of labour nobody chose.
const UNKNOWN_GREY = { id:'general', label:'General', glow:'#8fa6b8', ink:'#5c7386' };
let DESIG = { byId: new Map(), order: [], error: null, unknown: UNKNOWN_GREY };
function setDesignationPalette(p) {
  if (!p || !Array.isArray(p.designations)) return;
  DESIG = {
    byId: new Map(p.designations.map((d) => [d.id, d])),
    order: p.designations.map((d) => d.id),
    error: p.error || null,
    unknown: p.unknown || UNKNOWN_GREY,
  };
}
function desigOf(id) { return DESIG.byId.get(String(id || '')) || DESIG.unknown; }
/** The colour an agent's body, aura and orb take. Error wins over designation: a failing agent has to
 *  read as failing, and "slightly different shade of research" does not. */
function agentCss(a) {
  if (a.state === 'error') return DESIG.error || STATE_CSS.error;
  return desigOf(a.designation).glow;
}
// ── THE BODY WEARS THE MODEL (2026-11-25: "add different colors to each of the models") ──────────
// Designation keeps the floor ring and the legend's first block; the body, the head orb and its glow
// take the MODEL family (lib/modelhue.js, pushed with the roster like the designation palette).
// Until a palette arrives the body is a neutral grey, for the same reason as above.
let MODELS = { byId: new Map(), order: [], unknown: { id:'model', label:'Model unknown', body:'#9aa7b2' } };
function setModelPalette(p) {
  if (!p || !Array.isArray(p.families)) return;
  MODELS = { byId: new Map(p.families.map((f) => [f.id, f])), order: p.families.map((f) => f.id), unknown: p.unknown || MODELS.unknown };
}
function modelOf(id) { return MODELS.byId.get(String(id || '')) || MODELS.unknown; }
function bodyCss(a) {
  if (a.state === 'error') return DESIG.error || STATE_CSS.error;
  return modelOf(a.model).body;
}
// How strongly the body carries its designation, per state. This is the second channel: the hue does
// not change as an agent works, its INTENSITY does, so both facts stay readable at once.
// STATE_MIX is how much of the designation the body takes; STATE_DIM is how bright it is afterwards.
// BOTH are needed, and the reason is the character model: its base material is near-white, so mixing
// LESS hue into an idle agent makes it PALER, not dimmer — it came out almost pure white, which reads
// as washed out rather than resting. Darkening is what makes "dim = idle" in the legend true.
const STATE_MIX = { idle: 0.45, thinking: 0.50, working: 0.62, done: 0.55, error: 0.70 };
const STATE_DIM = { idle: 0.62, thinking: 0.90, working: 1.00, done: 1.00, error: 1.00 };

// state → which kind of POI this agent belongs at, and the clip it plays once seated/standing there.
// The office asset NAMES its anchors `poi-<clip>-<n>` (poi-sit_work-3, poi-idle-spawn-2, …), i.e. the
// artist encoded the animation into the layout. The old renderer ignored all of it and scattered a
// 4x3 grid inside the bounding box, which is why characters stood inside desks and walls.
const STATE_POI = {
  working:  { kind:'sit_work', clip:'Sit_Work' },
  thinking: { kind:'sit_idle', clip:'Sit_Idle' },
  idle:     { kind:'idle',     clip:'Idle' },
  done:     { kind:'idle',     clip:'Idle' },
  error:    { kind:'idle',     clip:'Idle' },
};
// One-shot reactions layered over the resting clip when a state CHANGES.
const STATE_REACTION = { done:'Happy', error:'Sad' };

const stage = document.getElementById('stage');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x070b12, 0.03);
const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.05, 500);
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

// Named rather than anonymous so applyPalette() can relight the room when the app's theme changes.
// The values here stay the original dark-scene ones; they are the fallback when no theme arrives.
const _amb = new THREE.AmbientLight(0x8298b0, 0.7); scene.add(_amb);
const _key = new THREE.DirectionalLight(0xbfe4ff, 1.4); _key.position.set(6, 12, 7); _key.castShadow = true;
_key.shadow.mapSize.set(1024, 1024); scene.add(_key);
const key = _key;                                            // existing references keep working
const _hemi = new THREE.HemisphereLight(0x9fc4e0, 0x0a1420, 0.6); scene.add(_hemi);
const _rim = new THREE.PointLight(0x4a7bd6, 0.7, 80); _rim.position.set(-8, 5, -8); scene.add(_rim);
const rim = _rim;
const _officeMats = [];
// COLOUR IN THE ROOM (2026-11-14: "add color to the 3D office"). Every desk, chair and plant in
// office.glb samples one white grid atlas, so the room rendered as grey clay whatever the theme. Each
// piece now gets its own copy of the material with a colour multiplier by what it IS — warm wood,
// upholstered seats, green plants, dark screens — so the office reads as a place. The atlas still
// supplies the grid and shading; the multiplier only colours it. Night mode keeps the hues and
// lowers them, so the room dims with the window rather than turning back into grey.
// (None of these may be a designation colour — scripts/test-designation.js checks — so agents stay
// the most saturated thing on the floor and are never mistaken for furniture.)
const ROOM_COLORS = [
  [/floor/, '#e9dcc6'], [/work-desk/, '#c08a58'], [/cafe-table|counter/, '#b9835a'], [/cabinet/, '#7fa391'],
  [/work-chair/, '#3b8f8a'], [/chair/, '#d9725a'], [/sofa/, '#5470a8'], [/plant/, '#4f9e5b'],
  [/pc|laptop/, '#3a404c'], [/flexo/, '#e8a93d'], [/board/, '#f3f1ea'],
];
const _roomMats = [];                                        // [{ m, light, night }] — the coloured pieces                                      // every office material, for the light themes
let _officeRoot = null;                                      // the loaded office scene, for measurement
const WHITE = new THREE.Color(0xffffff);                     // the neutral end of the room tint

// ---- adaptive framing -----------------------------------------------------
// ASPECT-AWARE. The old version derived the orbit radius from the room's footprint alone, ignoring
// the viewport: in the FLEET tab (a wide, short panel) the vertical FOV is the binding constraint,
// so a 9.4m-deep office at that radius was cropped to a corner. We now solve for the distance that
// actually fits the room's bounding sphere in BOTH axes, so the whole office is visible whatever
// shape the panel is — and re-solve on resize.
let focus = new THREE.Vector3(0, 1, 0), radius = 8, fitR = 6;

// ---- camera control: hold-and-drag to look around, slow orbit otherwise --------------------------
// The camera used to be a pure function of elapsed time (`orb = t * 0.12`), which made it beautiful
// and completely unusable: you could not turn to see an agent the far wall was hiding, and any
// attempt to grab the room did nothing. Azimuth/elevation are now STATE. Dragging writes to them;
// when nothing is held, azimuth keeps advancing at the same rate it always did — so releasing the
// mouse resumes the drift from wherever you left it instead of snapping back to the timeline.
const AUTOSPIN = 0.12;                                     // rad/s — unchanged from the old `t * 0.12`
const MIN_ELEV = THREE.MathUtils.degToRad(6);              // below this you are looking through the floor
const MAX_ELEV = THREE.MathUtils.degToRad(78);             // above it the room flattens into a plan view
const DRAG_SLOP = 4;                                       // px before a press becomes a drag, not a click
let azimuth = 0, elevation = THREE.MathUtils.degToRad(32); // 32° was the fixed elevation before
let drag = null;                                           // { id, x, y, moved } while a pointer is held

function beginDrag(ev) {
  if (ev.button != null && ev.button !== 0) return;        // left button only; right-click stays free
  drag = { id: ev.pointerId, x: ev.clientX, y: ev.clientY, moved: 0 };
  try { renderer.domElement.setPointerCapture(ev.pointerId); } catch {}
  renderer.domElement.style.cursor = 'grabbing';
}
function moveDrag(ev) {
  if (!drag || ev.pointerId !== drag.id) return false;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  drag.x = ev.clientX; drag.y = ev.clientY;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  // Scale by viewport so a drag across the panel turns the room by the same amount at any size.
  azimuth -= (dx / Math.max(1, innerWidth)) * Math.PI * 2.2;
  elevation = Math.min(MAX_ELEV, Math.max(MIN_ELEV, elevation + (dy / Math.max(1, innerHeight)) * Math.PI * 1.1));
  return true;
}
function endDrag(ev) {
  if (!drag || (ev && ev.pointerId !== drag.id)) return 0;
  const moved = drag.moved;
  try { renderer.domElement.releasePointerCapture(drag.id); } catch {}
  drag = null;
  renderer.domElement.style.cursor = 'default';
  return moved;                                            // caller uses this to tell a click from a drag
}
function solveRadius() {
  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  // distance needed for the bounding sphere to fit each axis; take the tighter one, plus margin.
  // The room is viewed from 32° elevation, so its depth foreshortens to ~cos(32°) on screen and the
  // strict bounding-sphere fit leaves a lot of dead space. 0.78 pulls in to a framing that fills the
  // panel while still keeping the far wall inside the frustum.
  const d = Math.max(fitR / Math.sin(vFov / 2), fitR / Math.sin(hFov / 2));
  radius = d * 0.78;
  camera.near = Math.max(0.01, radius / 200); camera.far = radius * 12;
  camera.updateProjectionMatrix();
}
// The box that actually matters: every anchor an agent can occupy, padded so nobody stands on the
// edge of frame. Falls back to the given box when the asset has no anchors.
function poiBox(fallback) {
  if (!pois.length) return fallback;
  const b = new THREE.Box3();
  for (const p of pois) b.expandByPoint(p.pos);
  const pad = Math.max(1.2, charTargetH * 1.1);
  b.expandByVector(new THREE.Vector3(pad, 0, pad));
  b.max.y = Math.max(b.max.y, b.min.y + charTargetH * 2);
  return b;
}
function frame(box) {
  box.getCenter(focus);
  const size = box.getSize(new THREE.Vector3());
  fitR = 0.5 * Math.hypot(size.x, size.z) * 0.82;   // bounding-sphere radius of the floor plan
  focus.y = box.min.y + size.y * 0.28;              // look slightly above the floor, not at the ceiling
  solveRadius();
}

// ---- loaders --------------------------------------------------------------
const draco = new DRACOLoader().setDecoderPath('./vendor/three/jsm/libs/draco/gltf/');
const gltf = new GLTFLoader().setDRACOLoader(draco);
const load = (url) => new Promise((res, rej) => gltf.load(url, res, undefined, rej));

let charTemplate = null, charScale = 1, floorY = 0, charTargetH = 1.7;
let clips = {};            // name → AnimationClip (the character ships 12; we use 9)
let pois = [];             // { name, kind, pos:Vector3, quat:Quaternion, taken:string|null }
let navTris = [];          // flat navmesh triangles in XZ, for walkability tests

// ---------------------------------------------------------------------------
// NAVMESH. office.glb ships a `navMesh` object: a flat 308-triangle cutout of the genuinely walkable
// floor (it excludes desks, the sofa, planters and the counter). We use it for two things: testing
// whether a point is walkable, and rasterising the clearance grid the pathfinder runs on.
// ---------------------------------------------------------------------------
function buildNav(mesh) {
  const g = mesh.geometry;
  const pos = g.attributes.position;
  const idx = g.index;
  const v = new THREE.Vector3();
  const read = (i) => { v.fromBufferAttribute(pos, i); mesh.localToWorld(v); return { x:v.x, z:v.z }; };
  if (idx) for (let i = 0; i < idx.count; i += 3) navTris.push([read(idx.getX(i)), read(idx.getX(i+1)), read(idx.getX(i+2))]);
  else for (let i = 0; i < pos.count; i += 3) navTris.push([read(i), read(i+1), read(i+2)]);
}
function pointInTri(px, pz, t) {
  const [a, b, c] = t;
  const d = (b.z - c.z) * (a.x - c.x) + (c.x - b.x) * (a.z - c.z);
  if (Math.abs(d) < 1e-9) return false;
  const u = ((b.z - c.z) * (px - c.x) + (c.x - b.x) * (pz - c.z)) / d;
  const w = ((c.z - a.z) * (px - c.x) + (a.x - c.x) * (pz - c.z)) / d;
  return u >= -0.02 && w >= -0.02 && (u + w) <= 1.02;
}
function onNav(x, z) {
  if (!navTris.length) return true;                    // no navmesh → don't constrain anything
  for (const t of navTris) if (pointInTri(x, z, t)) return true;
  return false;
}
// ---------------------------------------------------------------------------
// PATHFINDING — A* over a clearance grid, from WHERE THE AGENT IS to where it is going.
//
// 2026-11-25: "tiny pathfinding algorithms so they don't clip through the office items."
//
// The old router was Dijkstra over straight anchor-to-anchor lines, and it clipped in three ways:
//   1. the seat anchors sit INSIDE desk footprints (that is what a seat is), so every line to or from
//      a chair failed the navmesh test, the graph was disconnected, and route() fell back to "walk
//      straight and accept it" — straight through the desk;
//   2. it tested the line's CENTRE only, so a 0.4 m-wide body brushed table corners the centre missed;
//   3. a retarget mid-walk routed from the anchor being walked TO, not from where the body stood.
//
// Now: the navmesh is rasterised once into a grid whose cells are walkable only if a body-radius
// disc around the centre is (erosion = clearance). A* runs 8-connected with no corner-cutting, the
// path is string-pulled to the fewest straight legs that stay inside the grid, and the last metre
// into a seat comes from whichever side crosses the least furniture (exitCell). Standing agents are soft obstacles, so two people do not walk
// through each other either.
// ---------------------------------------------------------------------------
const NAV_CELL = 0.2, NAV_CLEAR = 0.2;            // metres: cell size, body radius kept clear
let navGrid = null;                                // { x0, z0, nx, nz, walk:Uint8Array }
function buildGrid() {
  if (!navTris.length) { navGrid = null; return; }
  let x0 = Infinity, z0 = Infinity, x1 = -Infinity, z1 = -Infinity;
  for (const t of navTris) for (const p of t) { x0 = Math.min(x0, p.x); z0 = Math.min(z0, p.z); x1 = Math.max(x1, p.x); z1 = Math.max(z1, p.z); }
  const nx = Math.ceil((x1 - x0) / NAV_CELL) + 1, nz = Math.ceil((z1 - z0) / NAV_CELL) + 1;
  const walk = new Uint8Array(nx * nz);
  const ring = [[0, 0]];
  for (let k = 0; k < 8; k++) ring.push([Math.cos(k * Math.PI / 4) * NAV_CLEAR, Math.sin(k * Math.PI / 4) * NAV_CLEAR]);
  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
    const cx = x0 + i * NAV_CELL, cz = z0 + j * NAV_CELL;
    walk[j * nx + i] = ring.every(([dx, dz]) => onNav(cx + dx, cz + dz)) ? 1 : 0;
  }
  // Waypoint height = the anchors' own floor height (the scene box's min.y can be a slab underside).
  const ys = pois.map((p) => p.pos.y).sort((a, b) => a - b);
  navGrid = { x0, z0, nx, nz, walk, y: ys.length ? ys[ys.length >> 1] : floorY };
}
const cellOf = (x, z) => [Math.round((x - navGrid.x0) / NAV_CELL), Math.round((z - navGrid.z0) / NAV_CELL)];
const cellPos = (i, j) => new THREE.Vector3(navGrid.x0 + i * NAV_CELL, navGrid.y, navGrid.z0 + j * NAV_CELL);
const walkable = (i, j) => i >= 0 && j >= 0 && i < navGrid.nx && j < navGrid.nz && navGrid.walk[j * navGrid.nx + i] === 1;
/** Metres of the straight segment p→q that lie OFF the walkable floor (over furniture). */
function offFloor(p, q) {
  const L = Math.hypot(q.x - p.x, q.z - p.z), steps = Math.max(1, Math.ceil(L / 0.05));
  let off = 0;
  for (let k = 1; k <= steps; k++) { const t = k / steps; if (!onNav(p.x + (q.x - p.x) * t, p.z + (q.z - p.z) * t)) off++; }
  return off * (L / steps);
}
/** The walkable cell a body steps onto to leave (or reach) point p — a seat sits inside its desk's or
 *  sofa's footprint, so this is the last metre of every sit-down. Scored by distance PLUS four times
 *  the length of that last leg that crosses furniture, so a chair is entered from the open side —
 *  behind a desk chair, in front of a sofa — without having to know which kind of seat it is. The
 *  search runs three rings past the first hit, so a clean approach a ring further out still wins. */
function exitCell(p) {
  const [ci, cj] = cellOf(p.x, p.z);
  if (walkable(ci, cj)) return [ci, cj];
  let best = null, bestS = Infinity, stopAt = 14;
  for (let r = 1; r <= stopAt; r++) {
    for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++) {
      if (Math.max(Math.abs(di), Math.abs(dj)) !== r || !walkable(ci + di, cj + dj)) continue;
      const q = cellPos(ci + di, cj + dj);
      const sc = Math.hypot(q.x - p.x, q.z - p.z) + 4 * offFloor(q, p);
      if (sc < bestS) { bestS = sc; best = [ci + di, cj + dj]; }
    }
    if (best && stopAt === 14) stopAt = Math.min(14, r + 3);
  }
  return best;
}
/** Grid line of sight with the body's width: every cell the segment passes over must be walkable. */
function gridClear(a, b) {

// A floating nameplate so the agents are tellable apart without hovering every one.
// ── THE PLATE ABOVE AN AGENT'S HEAD ─────────────────────────────────────────────────────────────
// It used to carry the agent's NAME, which is the one thing you can already tell from its colour and
// its position. What you actually want to know while a fan-out runs is WHAT EACH ONE IS DOING — the
// office was showing that something was happening without ever showing what.

// ── WHAT ONE AGENT JUST TOLD THE OTHERS ───────────────────────────────────────────────────────────
// The office made the division of labour readable and left out the half that makes a fleet a fleet:
// the agents talking to each other. Three people working silently at three desks look identical
// whether they are coordinating or not, and coordination is the thing worth watching.
//
// A bubble, not a third line on the nameplate. The plate answers "who is this and what are they on",
// which is true for as long as they are on it; a remark is true for a moment. Mixing a standing fact
// and a passing one in the same box makes both harder to read.

  const cv = document.createElement('canvas'); cv.width = BUBBLE_W; cv.height = BUBBLE_H;
  const ctx = cv.getContext('2d');

  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false }));
  spr.scale.set(2.4, 0.643, 1);

    ctx.clearRect(0, 0, BUBBLE_W, BUBBLE_H);

    // Wrap first, then size the bubble to the wrapped text — a fixed box around one short sentence is
    // mostly empty and around three lines is mostly clipped.
    const words = String(text || '').split(/\s+/).filter(Boolean);
    const maxW = BUBBLE_W - 56;
    const lines = [];
    let cur = '';
    for (const w of words) {
      const next = cur ? cur + ' ' + w : w;

      if (cur) lines.push(cur);

/** Show (or clear) an agent's remark. Lazily builds the sprite — most agents never say anything. */
function refreshBubble(a) {
  const text = a.says || '';
  if (text === a._bubbleText) return;
  a._bubbleText = text;
  if (!text) { if (a.bubble) a.bubble.visible = false; return; }
  if (!a.bubble) {
    a.bubble = makeBubble();

    // to clear a neighbour does not end up inside the bubble that belongs to it.

  // what "working" means in this room, and yanking it into a Wave for two seconds makes the seating

/** What this agent is doing, in the fewest words that are still true. */

// ── LABELS THAT DO NOT SIT ON EACH OTHER ──────────────────────────────────────────────────────────
// Two agents claiming adjacent anchors put their nameplates in the same few pixels, and one of them
// became unreadable — which matters more here than it sounds, because the plate is the ONLY place the
// office says what an agent is working on. Moving the characters would fight the authored layout
// (poi-* anchors encode where the artist wanted people to sit), so the plates move instead.
//
// Screen space, not world space: two agents a metre apart look far apart from one angle and stacked
// from another, and the whole problem is an angle-dependent one. Nearest-to-camera keeps its natural

function makeAvatar(label) {
  if (!charTemplate) return { group: fallbackAvatar(), mixer: null, actions: {} };
  const group = skeletonClone(charTemplate);
  group.scale.setScalar(charScale);
  // ⚠ SkeletonUtils.clone SHARES materials with the template, so every avatar in the office pointed
  // at the same material instances. Per-agent tinting then had all of them writing to one object,
  // each lerping toward a different state colour — and what you saw was their average: a uniform
  // muddy brown, on every character, no matter what any of them was doing. The colour-coding was
  // running correctly and cancelling itself out. Give each avatar its own materials.

    actions[name] = a;

  orb.position.y = (charTargetH + 0.30) * inv; group.add(orb);
  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.21 * inv, 16, 16), new THREE.MeshBasicMaterial({ color:0x3a4a5a, transparent:true, opacity:0.28 }));
  orb.add(glow);

// ---------------------------------------------------------------------------
// AGENT RUNTIME — keyed by AGENT ID, not array index. The old code indexed by position, so any
// reordering of the roster silently swapped every character's identity.
// ---------------------------------------------------------------------------
const agents = new Map();     // id → runtime record
const CLIP_FADE = 0.28;

  const next = a.actions[name];

  const prev = a.actions[a.clip];
  next.reset();
  next.setEffectiveWeight(1);
  next.enabled = true;

  next.play();

}

function react(a, name) {
  if (!a.actions[name]) return;
  playClip(a, name, { once:true });
  clearTimeout(a.reactTimer);
  const dur = (clips[name] && clips[name].duration) || 1.2;
  a.reactTimer = setTimeout(() => { a.clip = null; playClip(a, a.restClip || 'Idle'); }, dur * 1000);
}

function spawnAgent(info) {
  const label = info.name || info.role || info.id;
  const av = makeAvatar(label);
  const a = {

    plateTier: a.plate ? Math.round((a.plate.position.y - a.plate.userData.baseY) / (a.plate.userData.tierH || 1)) : 0,
    walking: a.path.length > 0, poi: a.poi >= 0 ? pois[a.poi].name : null,
    pathLen: a.path.length, clipOnce: !!a.clipOnce,
    offTarget: a.poi >= 0 ? +a.group.position.distanceTo(pois[a.poi].pos).toFixed(3) : null,
    x: Math.round((v.x * 0.5 + 0.5) * innerWidth),
    y: Math.round((-v.y * 0.5 + 0.5) * innerHeight),
    onScreen: v.z < 1 && Math.abs(v.x) <= 1 && Math.abs(v.y) <= 1,
  };
});

// ---- boot -----------------------------------------------------------------
Promise.all([ load('./vendor/presence3d/models/office.glb').catch(() => null),
              load('./vendor/presence3d/models/character.glb').catch(() => null) ])
.then(([office, character]) => {
  if (office) {
    const poiNodes = [], toHide = [];
    _officeRoot = office.scene;
    office.scene.traverse((o) => {
      const n = o.name || '';
      if (n === 'navMesh') { toHide.push(o); if (o.isMesh) buildNav(o); }
      else if (n.startsWith('poi-')) { poiNodes.push(o); toHide.push(o); }
      else if (o.isMesh) {
        o.receiveShadow = true; o.castShadow = true;
        const rc = ROOM_COLORS.find(([re]) => re.test(n));
        if (rc && o.material && !Array.isArray(o.material)) {
          o.material = o.material.clone();                   // shared atlas → this piece's own material
          const c = new THREE.Color(rc[1]);
          _roomMats.push({ m: o.material, light: c, night: c.clone().multiplyScalar(0.62) });
          return;
        }
        // Keep every office material so applyPalette can lift the room on a light theme. Relighting
        // alone is not enough: these materials are authored dark, and a dark material under a bright
        // key reads as grey clay rather than as a lit room.
        for (const m of (Array.isArray(o.material) ? o.material : [o.material])) {
          if (m && m.color && !_officeMats.includes(m)) {
            m.userData.__base = m.color.clone();
            _officeMats.push(m);
          }
        }
      }
    });
    scene.add(office.scene);
    office.scene.updateMatrixWorld(true);
    try { applyPalette(PALETTE); } catch {}                  // the room's colours need the materials, which only exist now
    for (const o of toHide) o.visible = false;
    // Parse `poi-<kind>-<n>`: poi-sit_work-3 → kind 'sit_work'; poi-idle-spawn-2 and
    // poi-idle-area-hub both → kind 'idle'. World transforms, so the anchors survive any
    // parent transform the asset might grow later.
    for (const o of poiNodes) {
      const m = /^poi-([a-z_]+?)(?:-(?:spawn|area))?-([a-z0-9]+)$/i.exec(o.name);
      const kind = m ? m[1].toLowerCase() : 'idle';
      pois.push({
        name: o.name, kind,
        pos: o.getWorldPosition(new THREE.Vector3()),
        quat: o.getWorldQuaternion(new THREE.Quaternion()),
        taken: null,
      });
    }
    buildGrid();
    const box = new THREE.Box3().setFromObject(office.scene);
    floorY = box.min.y;
    // FRAME THE PEOPLE, NOT THE BUILDING. office.glb's bounding box includes the whole shell — outer
    // walls, the far end nobody works in — and the anchors the artist placed sit in one corner of it.
    // Framing the shell therefore put four characters small and off-centre against a large empty
    // floor, which is the opposite of why they are here. So the camera fits the POI cloud (padded by
    // one character height so heads and nameplates are not clipped) and falls back to the shell only
    // if the asset ever ships without anchors.
    frame(poiBox(box));
  } else {
    const grid = new THREE.GridHelper(24, 24, 0x16324a, 0x0e2033); grid.material.transparent = true; grid.material.opacity = 0.3; scene.add(grid);
    frame(new THREE.Box3(new THREE.Vector3(-6,0,-6), new THREE.Vector3(6,3,6)));
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2;
      pois.push({ name:'ring-'+i, kind:'idle', pos:new THREE.Vector3(Math.cos(ang)*4, 0, Math.sin(ang)*4), quat:new THREE.Quaternion(), taken:null });
    }
    buildGrid();
  }
  if (character) {
    charTemplate = character.scene;
    for (const c of (character.animations || [])) clips[c.name] = c;
    const cb = new THREE.Box3().setFromObject(character.scene);
    const chH = Math.max(0.001, cb.getSize(new THREE.Vector3()).y);
    // DON'T RESCALE A MATCHED PAIR. office.glb and character.glb ship together in The Delegation and
    // are modelled at one scale — the office is in real metres (desk 1.35m, chair 0.75m, floor 10.2m)
    // and the character stands 1.31 units, which is a correct stylised adult beside a 0.75m chair.
    //
    // The old rule derived a person's height from the office's BOUNDING-BOX HEIGHT. That box has no
    // ceiling and no walls, so its 1.31 was just the tallest cabinet, and half of it gave targetH
    // 0.65: half-metre dolls in a ten-metre room, which is why the characters read as scenery rather
    // than as the point of the scene. The asset's own height is the answer.
    //
    // The footprint rule survives only as a GUARD, for a future asset whose character is not authored
    // to its room: a figure taller than a quarter of the floor, or shorter than a twentieth, is
    // rescaled to roughly six-to-a-room. A matched pair never reaches it.
    const footprint = office
      ? (() => { const sz = new THREE.Box3().setFromObject(office.scene).getSize(new THREE.Vector3()); return Math.min(sz.x, sz.z); })()
      : 10;
    const mismatched = chH > footprint * 0.25 || chH < footprint * 0.05;
    const targetH = mismatched ? Math.max(0.9, Math.min(2.2, footprint * 0.17)) : chH;
    charScale = targetH / chH; charTargetH = targetH;
  }
  // Anything spawned before the models landed is a fallback capsule — drop those and REBUILD from
  // the retained roster with the real rig. The old code cleared and then waited for the next push,
  // which is fine against main.js's 1.2s poll but leaves an empty room anywhere the payload only
  // arrives on change (the pop-out presence window, the dev harness) — and it also threw away the
  // POI claims, so the rebuilt agents piled onto the same anchor.
  for (const [, a] of agents) { clearTimeout(a.reactTimer); scene.remove(a.group); }
  agents.clear();
  for (const p of pois) p.taken = null;
  document.getElementById('loading').style.display = 'none';
  if (lastRoster.length) applyState(lastRoster);
  else document.getElementById('empty').classList.toggle('on', true);
})
.catch((e) => { console.error('presence load failed', e); document.getElementById('loading').textContent = 'scene unavailable'; });

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  renderer.setSize(innerWidth, innerHeight);
  solveRadius();                                    // re-fit: a wider panel needs a different distance
});

// ---- frame ----------------------------------------------------------------
const WALK_SPEED = 1.25;                                   // m/s — reads as purposeful, not scurrying
const clockT0 = performance.now(); let prev = clockT0;
let memoryConstrained = false;
window.addEventListener('message', e => { if (e.data?.type === 'memory-pressure') { memoryConstrained = /hot|critical/.test(e.data.level); renderer.setPixelRatio(memoryConstrained ? 1 : Math.min(devicePixelRatio, 1.5)); } });
const _tmp = new THREE.Vector3();
(function animate(now){
  requestAnimationFrame(animate);
  now = now || performance.now();
  // A hidden panel's iframe is display:none, which does NOT set document.hidden — the office went on
  // rendering shadows at 60 fps behind every other panel. A zero-size viewport is the tell.
  if (document.hidden || innerWidth === 0 || innerHeight === 0 || (memoryConstrained && now - prev < 100)) { prev = now; return; }
  const t = (now - clockT0) / 1000, dt = Math.min(0.05, (now - prev) / 1000); prev = now;

  // Slow cinematic orbit, now around USER-OWNED azimuth/elevation. Advancing azimuth only while
  // nothing is held is the whole trick: drag to aim, let go and the drift picks up from there.
  // Spherical (not cylindrical) so the TOTAL camera distance stays exactly `radius` — the value
  // solveRadius() proved fits the room — instead of drifting further out as height is added on top.
  if (!drag) azimuth += AUTOSPIN * dt;
  const horiz = Math.cos(elevation) * radius;
  camera.position.set(focus.x + Math.sin(azimuth) * horiz, focus.y + Math.sin(elevation) * radius, focus.z + Math.cos(azimuth) * horiz);
  camera.lookAt(focus.x, focus.y, focus.z);

  for (const [, a] of agents) {
    // --- walking: consume the navmesh route waypoint by waypoint --------------
    if (a.path.length) {
      const wp = a.path[0];
      _tmp.copy(wp.pos).sub(a.group.position); _tmp.y = 0;
      const dist = _tmp.length();
      if (dist < 0.06) {
        a.path.shift();
        if (!a.path.length) {                            // arrived: snap to the anchor's exact pose
          a.group.position.copy(wp.pos);
          a.group.quaternion.copy(wp.quat);
          playClip(a, a.restClip || 'Idle');
        }
      } else {
        _tmp.normalize();
        // GIVE WAY. Someone within a body's width ahead → wait; after 1.2 s of waiting, re-plan around
        // them (A* treats standing agents as costly cells). The lower id yields, so two walkers
        // heading at each other never both stop.
        let blocked = false;
        for (const [, o] of agents) {
          if (o === a) continue;
          const ox = o.group.position.x - a.group.position.x, oz = o.group.position.z - a.group.position.z;
          const d2 = ox * ox + oz * oz;
          if (d2 < 0.45 * 0.45 && (ox * _tmp.x + oz * _tmp.z) > 0 && (!o.path.length || a.id < o.id) && d2 < dist * dist) { blocked = true; break; }
        }
        if (blocked) {
          a.waited = (a.waited || 0) + dt;
          if (a.waited > 1.2 && a.poi >= 0) { a.waited = 0; a.path = planPath(a, a.poi); }
          if (a.clip !== 'Idle' && !a.clipOnce) playClip(a, 'Idle');
        } else {
          a.waited = 0;
          a.group.position.addScaledVector(_tmp, Math.min(WALK_SPEED * dt, dist));
          // face the direction of travel
          const yaw = Math.atan2(_tmp.x, _tmp.z);
          const want = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), yaw);
          a.group.quaternion.slerp(want, 1 - Math.pow(0.001, dt));
          if (a.clip !== 'Walk' && !a.clipOnce) playClip(a, 'Walk');
        }
      }
    } else if (a.clip === 'Walk' && a.poi >= 0) {
      // SELF-HEAL: the route emptied without the arrival branch firing (a retarget landed mid-step,
      // or the destination was re-claimed while we were walking to it). Without this the agent is
      // stranded metres from its anchor, moonwalking the Walk clip forever. Snap to the anchor and
      // settle into the resting pose rather than trying to enumerate every race that can do it.
      a.group.position.copy(pois[a.poi].pos);
      a.group.quaternion.copy(pois[a.poi].quat);
      playClip(a, a.restClip || 'Idle');
    }
    // --- idle life: arrived, nothing queued → wander or fidget ----------------
    if (!a.path.length) idleBeat(a, now);
    // --- animation + state tint ---------------------------------------------
    if (a.mixer) a.mixer.update(dt);
    if (a.plate) a.plate.quaternion.copy(camera.quaternion);
    if (a.bubble && a.bubble.visible) a.bubble.quaternion.copy(camera.quaternion);
    const tgt = a.target || new THREE.Color(STATE_COLOR.idle);
    if (a.aura) {
      a.aura.material.color.lerp(tgt, 0.08);
      a.aura.material.opacity = 0.3 + (a.state==='working' ? (Math.sin(t*5+a.phase)*0.25+0.3) : a.state==='thinking' ? 0.25 : 0.12);
    }
    const body = a.bodyTarget || tgt;
    if (a.orb) {
      a.orb.material.color.lerp(body, 0.1);
      const pulse = a.state==='working' ? 1 + Math.sin(t*6+a.phase)*0.18 : a.state==='thinking' ? 1 + Math.sin(t*3+a.phase)*0.1 : 1;
      a.orb.scale.setScalar(pulse);
    }
    if (a.glow) {
      a.glow.material.color.lerp(body, 0.1);
      a.glow.material.opacity = a.state==='idle' ? 0.16 : 0.3 + (a.state==='working' ? Math.sin(t*6+a.phase)*0.12 : 0);
    }
    // COLOUR-CODED BY DESIGNATION, on the body and not only the glow.
    //
    // Two earlier versions of this were wrong in instructive ways. The first lerped `emissive` alone at
    // 0.05, leaving the characters as grey clay with a faint halo — the legend said four colours and
    // the office showed one. The second fixed that but keyed the hue to STATE, so a busy fleet was a
    // room full of identical blue figures: it answered "is anything happening", which you can already
    // tell, and never "who is doing what", which is the entire reason to look at a room.
    //
    // Now the hue is the DESIGNATION and the state is carried by how much of it the body takes
    // (STATE_MIX) plus the pulse above. An idle researcher is a dim cyan, a working one is a bright
    // pulsing cyan, and a coder next to them is unmistakably green in both moods. The base keeps some
    // of its own material so they still look like figures rather than blobs.
    const light = PALETTE.mode === 'day' || PALETTE.mode === 'standby';
    const surf = surfaceOf(bodyCss(a), light);    // lit-surface variant of the MODEL colour
    const mix = STATE_MIX[a.state] ?? STATE_MIX.idle;
    for (const m of a.tint) {
      if (m.color) {
        if (!m.userData.__base) m.userData.__base = m.color.clone();
        const want = m.userData.__base.clone().lerp(surf, mix).multiplyScalar(STATE_DIM[a.state] ?? 1);
        m.color.lerp(want, 0.12);
      }
      if (m.emissive) {
        m.emissive.lerp(body, 0.08);
        m.emissiveIntensity = a.state==='working' ? 0.5 + Math.sin(t*7+a.phase)*0.2
          : a.state==='error' ? 0.45 + Math.sin(t*11+a.phase)*0.3     // a fast flash reads as alarm, not activity
          : a.state==='done' ? 0.4 : a.state==='thinking' ? 0.35 : 0.12;
      }
    }
  }
  deoverlapPlates();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
