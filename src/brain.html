<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' 'unsafe-inline' file:; style-src 'self' 'unsafe-inline'; connect-src 'none'"><title>BhatBot · Brain</title><link rel="stylesheet" href="theme.css"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px system-ui;background:var(--bg);color:var(--text)}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}header strong{margin-right:auto}button,input{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:7px;padding:7px 10px}main{position:relative;flex:1;min-height:0;overflow:hidden}#network{position:absolute;inset:0}.brain-cluster{position:absolute;transform:translate(-50%,-50%);background:var(--surface);color:var(--text);border-left:3px solid;padding:4px 8px;pointer-events:none}#detail{position:absolute;right:16px;bottom:45px;max-width:310px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;white-space:pre-wrap;max-height:40%;overflow:auto}footer{padding:10px 18px;color:var(--text-dim);font-size:12px}#hpanel{position:absolute;left:16px;bottom:45px;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:50%;overflow:auto;font-size:12px}#hpanel h4{margin:0 0 8px}#hpanel li{margin:0 0 8px;list-style:none}#hpanel ul{margin:0;padding:0}.sev{font-weight:600;text-transform:uppercase;font-size:10px;margin-right:6px}.sev.critical,.sev.high{color:#e5646a}.sev.medium{color:#f2c14e}.sev.low,.sev.info{color:var(--text-dim)}#hpanel .fix{color:var(--text-dim)}#status{color:var(--text-dim);font-size:12px}</style><script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script></head><body><header><strong>Brain</strong><span id="status">Loading memories…</span><input id="search" placeholder="Find a memory…" aria-label="Search memories"><button id="health" title="Brain health — click for the latest Psychiatrist report">Health —</button><button id="checkup">Checkup</button><button id="reset">Reset view</button></header><main><div id="network"></div><aside id="detail" hidden></aside><aside id="hpanel" hidden></aside></main><footer>Drag to orbit · scroll to zoom · click a memory to inspect it</footer><script type="module">
import {createNetwork} from './brain-network.mjs';
const colors={project:'#7fd4e8',file:'#8a94a6',memory:'#c9a2ff',concept:'#f2c14e',finding:'#59e39b',notion:'#e08a5a'};
const detail=document.getElementById('detail');let graph={nodes:[],edges:[]};
const network=createNetwork(document.getElementById('network'),{colors,isVisible:()=>true,onHover:()=>{},onSelect:n=>{detail.hidden=false;detail.textContent=n.label+'\n'+n.type+'\n\n'+(n.text||'No additional detail.')}});
function update(g){if(!g||g.error){document.getElementById('status').textContent=g?.error||'Could not load memories';return}graph=g;filter();document.getElementById('status').textContent=`${g.nodes.length} memories · ${g.edges.length} connections`;}
function filter(){const q=document.getElementById('search').value.toLowerCase();network.update({nodes:graph.nodes.filter(n=>[n.label,n.text,n.type].join(' ').toLowerCase().includes(q)),edges:graph.edges});}
document.getElementById('search').oninput=filter;document.getElementById('reset').onclick=()=>network.reset();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hbtn=document.getElementById('health'),hpanel=document.getElementById('hpanel');
function showHealth(r){if(!r){hbtn.textContent='Health —';hpanel.innerHTML='<h4>No checkup yet</h4>Press Checkup.';return}hbtn.textContent='Health '+r.score+' · '+r.grade;hpanel.innerHTML='<h4>Brain health '+r.score+'/100 ('+esc(r.grade)+') · '+new Date(r.at).toLocaleString()+'</h4><ul>'+r.findings.map(f=>'<li><span class="sev '+esc(f.severity)+'">'+esc(f.severity)+'</span>'+esc(f.what)+'<br>'+esc(f.evidence)+(f.suggestedFix?'<br><span class="fix">Proposed: '+esc(f.suggestedFix)+'</span>':'')+'</li>').join('')+'</ul>'}
hbtn.onclick=()=>{hpanel.hidden=!hpanel.hidden};
document.getElementById('checkup').onclick=async()=>{hbtn.textContent='Checking…';const r=await window.brain.checkup();if(r&&r.report)showHealth(r.report);else{hbtn.textContent='Health ⚠';hpanel.hidden=false;hpanel.textContent=(r&&r.error)||'Checkup failed'}};
window.brain.health().then(showHealth).catch(()=>{});window.brain.onHealth(showHealth);
window.brain.graph().then(update).catch(()=>update({error:'Unable to load the brain. Reopen this window.'}));window.brain.onUpdate(update);window.brain.onPressure(v=>network.setPressure(v.active));
</script></body></html>
